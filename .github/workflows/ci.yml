name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-2022
            target: windows-amd64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node scripts/platform-tests.mjs
      - run: pnpm build
      - run: node scripts/smoke.mjs
      - run: pnpm pack --pack-destination .artifacts/release
      - run: node scripts/release-manifest.mjs
        env:
          RELEASE_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: .artifacts/release/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/download-artifact@v4
        with:
          path: .artifacts/platforms
          pattern: plugin-*
      - run: node scripts/collect-release.mjs
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" .artifacts/publish/* --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes-file FORK.md
